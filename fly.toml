# Configuration Fly.io — même schéma que Le Brief : une app, un volume, une
# machine qui reste allumée (la boucle d'envoi tourne dedans).
app = "leradar"
primary_region = "cdg"   # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  CR_DATA_DIR = "/data"
  # Le domaine sert aux retours Google (connexion + Gmail) et au pixel d'ouverture.
  CR_BASE_URL = "https://leradar.valentinlefevre.io"
  CR_PUBLIC_URL = "https://leradar.valentinlefevre.io"
  # Le premier compte autorisé à se connecter, avant même que Gmail soit relié.
  CR_ALLOWED_EMAILS = "valentin.lefevre33300@gmail.com"
  CR_SENDER_NAME = "Valentin Lefevre"
  # Les secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ANTHROPIC_API_KEY)
  # passent par `fly secrets set`, jamais par ce fichier.

# Volume persistant : base SQLite, jeton Gmail, CV, exports, clé de session.
[mounts]
  source = "leradar_data"
  destination = "/data"

[http_service]
  internal_port = 8010
  force_https = true
  # La machine ne s'éteint pas : les envois programmés et la lecture des
  # réponses dépendent des boucles de fond.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
