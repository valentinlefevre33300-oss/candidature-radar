name: Déploiement Fly.io

# Chaque push sur master redéploie l'app. Prérequis : un secret de dépôt
# FLY_API_TOKEN (créé avec `fly tokens create deploy -x 999999h`).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FLY_DEPLOY != 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
